name: Fox Stats Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Fox stats test
        run: |
          set -e

          echo "=== RUN: fox_stats.py ==="
          python -u fox_stats.py

      - name: Show generated file
        run: |
          echo "=== fox_player_stats.csv preview ==="

          if [ -f fox_player_stats.csv ]; then
            echo "Rows:"
            wc -l fox_player_stats.csv

            echo ""
            echo "First 20 lines:"
            head -20 fox_player_stats.csv
          else
            echo "fox_player_stats.csv was not created"
            exit 1
          fi

      - name: Commit Fox stats test output
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add fox_player_stats.csv

          git commit -m "Update Fox Sports player stats test" || echo "No changes to commit"

          git pull --rebase origin "${GITHUB_REF_NAME}" || true

          git push || echo "Nothing to push"
