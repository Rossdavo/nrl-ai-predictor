name: Run NRL predictions

on:
  workflow_dispatch:
  schedule:
    - cron: "30 19 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tipping model + trackers + reports
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -e

          echo "=== RUN: odds_fetch.py ==="
          python -u odds_fetch.py

          echo "=== RUN: predict.py ==="
          python -u predict.py

          echo "=== RUN: archive.py ==="
          python -u archive.py

          if [ -f build_current_predictions.py ]; then
            echo "=== RUN: build_current_predictions.py ==="
            python -u build_current_predictions.py
          else
            echo "=== SKIP: build_current_predictions.py not found ==="
          fi

          if [ -f build_completed_round.py ]; then
            echo "=== RUN: build_completed_round.py ==="
            python -u build_completed_round.py
          else
            echo "=== SKIP: build_completed_round.py not found ==="
          fi

          echo "=== RUN: tracker.py ==="
          python -u tracker.py

          echo "=== RUN: performance.py ==="
          python -u performance.py || true

          echo "=== RUN: report.py ==="
          python -u report.py || true

      - name: Commit generated data back to repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Update predictions/data" || echo "No changes to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push || echo "Nothing to push"

      - name: Prepare site
        run: |
          mkdir -p site
          cp index.html site/index.html

          if [ -f current_predictions.csv ]; then cp current_predictions.csv site/current_predictions.csv; fi
          if [ -f latest_completed_round.csv ]; then cp latest_completed_round.csv site/latest_completed_round.csv; fi

          if [ -f predictions.csv ]; then cp predictions.csv site/predictions.csv; fi
          if [ -f predictions_history.csv ]; then cp predictions_history.csv site/predictions_history.csv; fi
          if [ -f odds.csv ]; then cp odds.csv site/odds.csv; fi
          if [ -f odds_history.csv ]; then cp odds_history.csv site/odds_history.csv; fi
          if [ -f results_cache.csv ]; then cp results_cache.csv site/results_cache.csv; fi
          if [ -f accuracy.csv ]; then cp accuracy.csv site/accuracy.csv; fi
          if [ -f accuracy_summary.csv ]; then cp accuracy_summary.csv site/accuracy_summary.csv; fi
          if [ -f performance.csv ]; then cp performance.csv site/performance.csv; fi
          if [ -f ratings.json ]; then cp ratings.json site/ratings.json; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
